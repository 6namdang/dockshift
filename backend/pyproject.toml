[project]
name = "dockshift-backend"
version = "0.1.0"
description = "Dockshift backend: FastAPI service + MCP literature-search tools (PubMed, bioRxiv, ChemRxiv, patents)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mcp>=2.0",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
